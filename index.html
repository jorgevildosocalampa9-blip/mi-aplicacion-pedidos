<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="fotos/LOGO.ico" type="image/x-icon">

    <title>Registro</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="./css/Style.css">
</head>

<body>

    <!-- MENÚ LATERAL -->
    <button id="btnMenu" class="btn-menu" type="button">☰</button>
    <div id="menuFondo" class="menu-fondo"></div>

    <nav id="menuLateral" class="menu-lateral">
        <h2>MENÚ</h2>

        <a href="admin.html">Panel principal</a>
        <a href="index.html">Registrar pedido</a>
        <a href="mispedidos.html">Ver mis pedidos</a>
        <a href="inventario.html">Inventario</a>
        <a href="etiquetas/etiquetas.html">Generar etiqueta</a>

        <button id="btnCerrarSesionMenu" type="button">
            Cerrar sesión
        </button>
    </nav>
    <!-- INICIO DE SESIÓN -->
    <div id="loginOverlay">
        <div id="loginBox">
            <h2>Iniciar sesión</h2>

            <input type="email" id="email" placeholder="Correo" autocomplete="username">

            <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password">

            <button id="btnLogin" type="button">Ingresar</button>

            <p>
                <a href="#" id="btnOlvidePassword">¿Olvidaste tu contraseña?</a>
            </p>

            <p id="recuperacionMensaje"></p>
            <p id="loginError"></p>
        </div>
    </div>

    <!-- REGISTRO DE PEDIDOS -->
    <form id="formularioPedido">
        <h2 class="tema">Registro de cliente</h2>

        <input type="text" id="nombre" placeholder="Nombre" required>
        <input type="text" id="apellido" placeholder="Apellido" required>
        <input type="text" id="numero" placeholder="Número de teléfono" required>

        <input type="text" id="provincia" placeholder="Provincia o localidad" required>

        <select id="destino" required>
            <option value="">Selecciona el tipo de envío</option>
            <option value="Lima">Lima</option>
            <option value="Provincia">Provincia</option>
        </select>

        <select id="pedido" required>
            <option value="">Cargando productos...</option>
        </select>

        <input type="number" id="cantidad" placeholder="Cantidad" min="1" step="1" required>

        <input type="submit" class="btn" value="Registrar">
    </form>

    <button id="btnCerrarSesion" type="button">Cerrar sesión</button>

    <script src="js/script.js"></script>
</body>

</html>
