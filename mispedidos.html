<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mis Pedidos</title>

    <link rel="stylesheet" href="Style.css">

    <style>

        .contenedor {
            width: 90%;
            max-width: 1000px;
            text-align: center;
        }

        .contenedor h2 {
            color: azure;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgb(21, 22, 22);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, .8);
            color: white;
            text-align: left;
            border-top: 5px solid #95a5a6;
        }

        .card.Preparando {
            border-top-color: orange;

        .card.Enviando {
            border-top-color: #3498db;

            background: #3498db;

        .Entregado .badge {
            background: #2ecc71;

        }

        .btns {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 10px;

        .btns button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }

        .btns button:hover {
            opacity: 0.85;
        }

    </style>
</head>

<body>

    <div class="contenedor">

        <h2>Mis Pedidos</h2>

        <button
            onclick="exportarTodo()"
            class="btn-link"
            style="border:none;cursor:pointer;margin-bottom:20px"
        >
            Exportar todo
        </button>

        <div class="grid" id="gridPedidos"></div>

        <div style="margin-top:20px">
            <a href="index.html" class="btn-link">
                Volver a Registrar
            </a>
        </div>

    </div>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        // =====================================================
        // CONEXIÓN CON SUPABASE
        // =====================================================

        const SUPABASE_URL =
            "https://ckpuoiztfavuuijaedbe.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_qZxbp2ozqUQ9Kj85vSoTSg_JUGIFlJP";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        console.log("Supabase conectado en Mis Pedidos");


        // =====================================================
        // MOSTRAR PEDIDOS
        // =====================================================

        async function mostrarPedidos() {

            const grid = document.getElementById("gridPedidos");

            grid.innerHTML =
                "<p style='color:white'>Cargando pedidos...</p>";


            const { data: pedidos, error } = await supabaseClient
                .from("pedidos")
                .select("*")
                .order("id", { ascending: false });


            if (error) {

                console.error(
                    "ERROR AL CARGAR PEDIDOS:",
                    error
                );

                grid.innerHTML =
                    "<p style='color:red'>Error al cargar los pedidos</p>";

                alert(error.message);

                return;
            }


            grid.innerHTML = "";


            if (!pedidos || pedidos.length === 0) {

                grid.innerHTML =
                    "<p style='color:white'>No hay pedidos aún</p>";

                return;
            }


            pedidos.forEach((p) => {

                const estado =
                    p.estado || "En espera";


                const div =
                    document.createElement("div");


                div.className =
                    `card ${estado.replace(" ", "-")}`;


                div.innerHTML = `

                    <h3>
                        ${p.nombre || ""} ${p.apellido || ""}
                    </h3>

                    <small>
                        🔖 Pedido: ${p.codigo || "s/c"}
                    </small>

                    <small>
                        📅 Registrado: ${p.fecha || "Sin fecha"}
                    </small>

                    <p>
                        <b>N°:</b> ${p.numero || ""}
                    </p>

                    <p>
                        <b>Provincia:</b> ${p.provincia || ""}
                    </p>

                    <p>
                        <b>Pedido:</b>
                        ${p.pedido || ""}
                        x${p.cantidad || ""}
                    </p>

                    <span class="badge">
                        ${estado}
                    </span>


                    <!-- BOTONES DE ESTADO -->

                    <div class="btns">

                        <button
                            onclick="cambiarEstado(
                                '${p.codigo}',
                                'En espera'
                            )"
                            style="background:#95a5a6;color:white"
                        >
                            En espera
                        </button>


                        <button
                            onclick="prepararPedido(
                                '${p.codigo}'
                            )"
                            style="background:orange;color:black"
                        >
                            Preparando
                        </button>


                        <button
                            onclick="enviarPedido(
                                '${p.codigo}'
                            )"
                            style="background:#3498db;color:white"
                        >
                            Enviando
                        </button>


                        <button
                            onclick="entregarPedido(
                                '${p.codigo}'
                            )"
                            style="background:#2ecc71;color:white"
                        >
                            Entregado
                        </button>

                    </div>


                    <!-- ELIMINAR -->

                    <div class="btns">

                        <button
                            onclick="borrarUno(
                                '${p.codigo}'
                            )"
                            style="background:#603432;color:white"
                        >
                            Eliminar
                        </button>

                    </div>


                    <!-- EXPORTAR -->

                    <div class="btns">

                        <button
                            onclick="exportarUno(
                                '${p.codigo}'
                            )"
                            style="background:#8e44ad;color:white"
                        >
                            Exportar
                        </button>

                    </div>

                `;


                grid.appendChild(div);

            });

        }



        // =====================================================
        // BUSCAR PEDIDO
        // =====================================================

        async function obtenerPedido(codigo) {

            const { data, error } =
                await supabaseClient
                    .from("pedidos")
                    .select("*")
                    .eq("codigo", codigo)
                    .single();


            if (error) {

                console.error(
                    "ERROR AL BUSCAR PEDIDO:",
                    error
                );

                alert(
                    "No se pudo encontrar el pedido."
                );

                return null;
            }


            return data;
        }



        // =====================================================
        // CAMBIAR ESTADO
        // =====================================================

        async function actualizarEstado(
            codigo,
            nuevoEstado
        ) {

            const { error } =
                await supabaseClient
                    .from("pedidos")
                    .update({
                        estado: nuevoEstado
                    })
                    .eq("codigo", codigo);


            if (error) {

                console.error(
                    "ERROR AL ACTUALIZAR ESTADO:",
                    error
                );

                alert(
                    "No se pudo actualizar el estado:\n" +
                    error.message
                );

                return false;
            }


            console.log(
                "Estado actualizado:",
                nuevoEstado
            );


            await mostrarPedidos();

            return true;
        }



        // =====================================================
        // EN ESPERA
        // =====================================================

        async function cambiarEstado(
            codigo,
            nuevoEstado
        ) {

            await actualizarEstado(
                codigo,
                nuevoEstado
            );

        }



        // =====================================================
        // PREPARANDO
        // =====================================================

        async function prepararPedido(codigo) {

            const pedido =
                await obtenerPedido(codigo);


            if (!pedido) return;


            const actualizado =
                await actualizarEstado(
                    codigo,
                    "Preparando"
                );


            if (!actualizado) return;


            let numero =
                String(pedido.numero || "")
                    .replace(/\D/g, "");


            if (numero.length === 9) {
                numero = "51" + numero;
            }


            const mensaje =
`Hola ${pedido.nombre} 👋

Tu pedido ${pedido.codigo} ya está preparado.

📦 Pedido: ${pedido.pedido}
🔢 Cantidad: ${pedido.cantidad}

Nos comunicaremos contigo cuando tu pedido esté en camino.

¡Gracias por tu compra!`;


            abrirWhatsApp(
                numero,
                mensaje
            );

        }



        // =====================================================
        // ENVIANDO
        // =====================================================

        async function enviarPedido(codigo) {

            const pedido =
                await obtenerPedido(codigo);


            if (!pedido) return;


            const actualizado =
                await actualizarEstado(
                    codigo,
                    "Enviando"
                );


            if (!actualizado) return;


            let numero =
                String(pedido.numero || "")
                    .replace(/\D/g, "");


            if (numero.length === 9) {
                numero = "51" + numero;
            }


            const mensaje =
`Hola ${pedido.nombre} 👋

Tu pedido ${pedido.codigo} ya está en camino 🚚.

📦 Pedido: ${pedido.pedido}
🔢 Cantidad: ${pedido.cantidad}

Por favor, mantente atento a tu teléfono para la entrega.

¡Gracias por tu compra!`;


            abrirWhatsApp(
                numero,
                mensaje
            );

        }



        // =====================================================
        // ENTREGADO
        // =====================================================

        async function entregarPedido(codigo) {

            const pedido =
                await obtenerPedido(codigo);


            if (!pedido) return;


            const actualizado =
                await actualizarEstado(
                    codigo,
                    "Entregado"
                );


            if (!actualizado) return;


            let numero =
                String(pedido.numero || "")
                    .replace(/\D/g, "");


            if (numero.length === 9) {
                numero = "51" + numero;
            }


            const mensaje =
`Hola ${pedido.nombre} 👋

Tu pedido ${pedido.codigo} ha sido entregado correctamente ✅.

📦 Pedido: ${pedido.pedido}
🔢 Cantidad: ${pedido.cantidad}

¡Muchas gracias por tu compra!`;


            abrirWhatsApp(
                numero,
                mensaje
            );

        }



        // =====================================================
        // ABRIR WHATSAPP
        // =====================================================

        function abrirWhatsApp(
            numero,
            mensaje
        ) {

            if (!numero) {

                alert(
                    "Este pedido no tiene número de teléfono."
                );

                return;
            }


            const url =
                `https://wa.me/${numero}?text=${
                    encodeURIComponent(mensaje)
                }`;


            window.open(
                url,
                "_blank"
            );

        }



        // =====================================================
        // ELIMINAR PEDIDO
        // =====================================================

        async function borrarUno(codigo) {

            console.log(
                "Intentando eliminar:",
                codigo
            );


            if (
                !confirm(
                    "¿Seguro que quieres eliminar este pedido?"
                )
            ) {
                return;
            }


            const { error } =
                await supabaseClient
                    .from("pedidos")
                    .delete()
                    .eq("codigo", codigo);


            if (error) {

                console.error(
                    "ERROR AL ELIMINAR:",
                    error
                );

                alert(
                    "Error al eliminar:\n" +
                    error.message
                );

                return;
            }


            alert(
                "Pedido eliminado correctamente."
            );


            await mostrarPedidos();

        }



        // =====================================================
        // CONVERTIR PEDIDOS A CSV
        // =====================================================

        function pedidosACSV(pedidos) {

            const columnas = [
                "codigo",
                "nombre",
                "apellido",
                "numero",
                "provincia",
                "fecha",
                "estado",
                "cantidad",
                "pedido"
            ];


            const encabezado =
                columnas.join(";");


            const filas =
                pedidos.map(p =>

                    columnas.map(c =>

                        `"${String(
                            p[c] ?? ""
                        ).replace(
                            /"/g,
                            '""'
                        )}"`

                    ).join(";")

                );


            return [
                encabezado,
                ...filas
            ].join("\n");

        }



        // =====================================================
        // DESCARGAR ARCHIVO
        // =====================================================

        function descargarArchivo(
            contenido,
            nombreArchivo
        ) {

            const blob =
                new Blob(
                    ["\uFEFF" + contenido],
                    {
                        type:
                            "text/csv;charset=utf-8;"
                    }
                );


            const url =
                URL.createObjectURL(blob);


            const a =
                document.createElement("a");


            a.href = url;
            a.download = nombreArchivo;


            document.body.appendChild(a);

            a.click();

            a.remove();


            URL.revokeObjectURL(url);

        }



        // =====================================================
        // EXPORTAR TODOS
        // =====================================================

        async function exportarTodo() {

            const { data: pedidos, error } =
                await supabaseClient
                    .from("pedidos")
                    .select("*")
                    .order(
                        "id",
                        {
                            ascending: false
                        }
                    );


            if (error) {

                console.error(
                    "ERROR AL EXPORTAR:",
                    error
                );

                alert(
                    "No se pudieron obtener los pedidos."
                );

                return;
            }


            if (
                !pedidos ||
                pedidos.length === 0
            ) {

                alert(
                    "No hay pedidos para exportar."
                );

                return;
            }


            descargarArchivo(
                pedidosACSV(pedidos),
                "todos_los_pedidos.csv"
            );

        }



        // =====================================================
        // EXPORTAR UN PEDIDO
        // =====================================================

        async function exportarUno(codigo) {

            const pedido =
                await obtenerPedido(codigo);


            if (!pedido) return;


            const nombre =
                `${pedido.nombre || "pedido"}_${
                    pedido.apellido || ""
                }`;


            descargarArchivo(
                pedidosACSV([pedido]),
                `pedido_${nombre}.csv`
            );

        }



        // =====================================================
        // CARGAR PEDIDOS AL ABRIR LA PÁGINA
        // =====================================================

        mostrarPedidos();

    </script>

</body>

</html>
