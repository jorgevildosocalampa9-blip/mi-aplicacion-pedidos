<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="Style.css">
    
</head>
<body>
    <div id="loginOverlay">

    <div id="loginBox">

        <h2>Iniciar sesión</h2>

        <input type="email" id="email" placeholder="Correo">

        <input type="password" id="password" placeholder="Contraseña">

        <button id="btnLogin">Ingresar</button>
        <p>
    <a href="#" id="btnOlvidePassword">¿Olvidaste tu contraseña?</a>
</p>

<p id="recuperacionMensaje"></p>

        <p id="loginError"></p>

    </div>

</div>

  <form id="formularioPedido">
      <h2 class="tema">Registro de cliente</h2>
      <input type="text" id="nombre" placeholder="Nombre" required>
      <input type="text" id="apellido" placeholder="Apellido" required>
      <input type="text" id="numero" placeholder="Numero" required>
      <input type="text" id="provincia" placeholder="Provincia" required>
      <input type="text" id="pedido" placeholder="Pedido" required>
      <input type="number" id="cantidad" placeholder="Cantidad" required>
      <input type="submit" class="btn" value="Registrar">
    
  </form>

  <a href="mispedidos.html" class="btn-link">Ver Mis Pedidos</a>

  <button id="btnCerrarSesion">Cerrar sesión</button>
  
  <script src="script.js"></script>
</body>
</html>
