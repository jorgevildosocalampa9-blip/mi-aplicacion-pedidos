
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101010">
    <link rel="icon" href="fotos/LOGO.ico" type="image/x-icon">
    <title>Mis Pedidos | JAGGER MOVE</title>
    <link rel="stylesheet" href="./css/Style.css">

    
<style>
/* =========================================
   JAGGER MOVE — PREMIUM ORDER MANAGEMENT
========================================= */

:root {
    --jm-bg: #090a0c;
    --jm-panel: #13151a;
    --jm-panel-hover: #191b21;
    --jm-red: #ff3545;
    --jm-red-dark: #d91f30;
    --jm-text: #f5f5f7;
    --jm-muted: #969ba6;
    --jm-border: rgba(255,255,255,.09);
}

body {
    margin: 0;
    min-height: 100vh;
    color: var(--jm-text);
    background:
        radial-gradient(ellipse at 50% 0%,
            rgba(255,53,69,.10), transparent 42%),
        linear-gradient(145deg, #0d0e11, #08090b 75%);
    background-attachment: fixed;
    font-family: "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
}

body,
body * {
    box-sizing: border-box;
}

/* CONTENEDOR */

.contenedor {
    width: min(1200px, calc(100% - 48px));
    margin: 0 auto;
    padding: 45px 0 55px;
    text-align: left;
}

/* ENCABEZADO */

.encabezado-pedidos {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 24px;
    margin-bottom: 36px;
    padding: 30px;
    overflow: hidden;
    background: linear-gradient(120deg, #191b20, #101115);
    border: 1px solid var(--jm-border);
    border-left: 3px solid var(--jm-red);
    border-radius: 19px;
    box-shadow: 0 18px 50px rgba(0,0,0,.22);
    animation: jmEntrada .45s ease both;
}

.encabezado-texto {
    min-width: 0;
}

.encabezado-marca {
    display: block;
    margin-bottom: 13px;
    color: var(--jm-red);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 3px;
    line-height: 1.7;
}

.encabezado-pedidos h1 {
    margin: 0;
    color: #fff;
    font-size: clamp(31px, 4vw, 44px);
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -1.4px;
    text-transform: uppercase;
}

.encabezado-pedidos h1 span {
    color: var(--jm-red);
}

.encabezado-descripcion {
    max-width: 540px;
    margin: 13px 0 0;
    color: var(--jm-muted);
    font-size: 13px;
    line-height: 1.7;
}

/* EXPORTACIÓN */

.btn-exportar-todo {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    min-height: 45px;
    padding: 13px 18px;
    color: #fff;
    background: linear-gradient(110deg, #ff3545, #d91f30);
    border: 1px solid rgba(255,100,110,.65);
    border-radius: 9px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 850;
    letter-spacing: .7px;
    cursor: pointer;
    transition: .2s ease;
}

.btn-exportar-todo:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(255,53,69,.2);
    filter: brightness(1.08);
}

/* CABECERA DE LA LISTA */

.barra-lista {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin: 0 0 19px;
}

.barra-lista h2 {
    margin: 0;
    color: #f5f5f7;
    font-size: 12px;
    font-weight: 850;
    letter-spacing: 1.6px;
    text-transform: uppercase;
}

.barra-lista h2::before {
    content: "";
    display: inline-block;
    width: 4px;
    height: 17px;
    margin-right: 11px;
    background: var(--jm-red);
    border-radius: 4px;
    vertical-align: -4px;
}

.barra-lista small {
    color: #858a95;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.1px;
}

/* CUADRÍCULA DE PEDIDOS */

.grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    align-items: stretch;
    gap: 17px;
}

/* TARJETAS */

.card {
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 22px;
    overflow-wrap: anywhere;
    background: linear-gradient(145deg, #17191e, #101115);
    border: 1px solid var(--jm-border);
    border-top: 2px solid #777e89;
    border-radius: 15px;
    box-shadow: 0 12px 30px rgba(0,0,0,.18);
    color: var(--jm-text);
    text-align: left;
    transition: transform .22s ease,
                border-color .22s ease,
                box-shadow .22s ease;
    animation: jmEntrada .35s ease both;
}

.card:hover {
    transform: translateY(-3px);
    border-right-color: rgba(255,255,255,.15);
    border-bottom-color: rgba(255,255,255,.15);
    border-left-color: rgba(255,255,255,.15);
    box-shadow: 0 18px 38px rgba(0,0,0,.3);
}

.card.En-espera {
    border-top-color: #8993a1;
}

.card.Preparando {
    border-top-color: #ffb547;
}

.card.Enviando {
    border-top-color: #55a8ff;
}

.card.Entregado {
    border-top-color: #42cf91;
}

.card h3 {
    margin: 0 0 12px;
    color: #fff;
    font-size: 17px;
    font-weight: 850;
    line-height: 1.45;
    letter-spacing: -.2px;
}

.card > small {
    display: block;
    margin-bottom: 8px;
    color: #969ba6;
    font-size: 11px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

.card p {
    margin: 9px 0;
    color: #c8cbd3;
    font-size: 12px;
    line-height: 1.7;
    overflow-wrap: anywhere;
}

.card p b {
    color: #f5f5f7;
    font-weight: 750;
}

/* ETIQUETAS DE ESTADO */

.badge {
    display: inline-flex;
    align-self: flex-start;
    align-items: center;
    justify-content: center;
    gap: 7px;
    margin: 10px 0 16px;
    padding: 8px 11px;
    background: rgba(137,147,161,.10);
    border: 1px solid rgba(137,147,161,.3);
    border-radius: 7px;
    color: #d6dbe3;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: .9px;
    text-transform: uppercase;
}

.badge::before {
    content: "";
    width: 6px;
    height: 6px;
    flex-shrink: 0;
    background: currentColor;
    border-radius: 50%;
}

.En-espera .badge {
    background: rgba(137,147,161,.10);
    border-color: rgba(137,147,161,.3);
    color: #c4cbd5;
}

.Preparando .badge {
    background: rgba(255,181,71,.09);
    border-color: rgba(255,181,71,.28);
    color: #ffc56b;
}

.Enviando .badge {
    background: rgba(85,168,255,.09);
    border-color: rgba(85,168,255,.28);
    color: #82c1ff;
}

.Entregado .badge {
    background: rgba(66,207,145,.09);
    border-color: rgba(66,207,145,.28);
    color: #6ce4ac;
}

/* BOTONES DE ACCIONES */

.btns {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin-top: 11px;
}

.btns button {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    min-width: 0;
    min-height: 39px;
    padding: 9px 7px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 8px;
    font-family: inherit;
    font-size: 10px;
    font-weight: 800;
    line-height: 1.4;
    overflow-wrap: anywhere;
    cursor: pointer;
    transition: transform .18s ease,
                filter .18s ease,
                border-color .18s ease;
}

.btns button:hover {
    filter: brightness(1.15);
    transform: translateY(-1px);
}

.btns button:active {
    transform: scale(.98);
}

.btns button:focus-visible,
.btn-exportar-todo:focus-visible,
.btn-menu:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 3px;
}

/* BOTONES SECUNDARIOS */

.card .btns + .btns {
    margin-top: 9px;
}

/* MENSAJES DE CARGA, ERROR Y LISTA VACÍA */

#gridPedidos > p {
    grid-column: 1 / -1;
    margin: 0;
    padding: 32px 20px;
    background: rgba(19,21,26,.95);
    border: 1px solid var(--jm-border);
    border-radius: 13px;
    color: #c5c9d2;
    font-size: 13px;
    line-height: 1.8;
    text-align: center;
}

/* MENÚ LATERAL */

.btn-menu {
    position: fixed;
    top: 17px;
    left: 17px;
    z-index: 10002;
    display: block;
    padding: 12px 16px;
    color: #fff;
    background: rgba(17,19,23,.97);
    border: 1px solid rgba(255,255,255,.13);
    border-left: 3px solid var(--jm-red);
    border-radius: 9px;
    font-family: inherit;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 7px 24px rgba(0,0,0,.3);
    transition: .2s;
}

.btn-menu:hover {
    color: var(--jm-red);
    border-color: var(--jm-red);
}

.menu-lateral {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 10003;
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 285px;
    max-width: 86vw;
    height: 100vh;
    height: 100dvh;
    padding: 80px 20px 22px;
    overflow-y: auto;
    background: #111317;
    border-right: 1px solid var(--jm-border);
    box-shadow: 15px 0 45px rgba(0,0,0,.35);
    transform: translateX(-105%);
    visibility: hidden;
    transition: transform .3s ease, visibility .3s ease;
}

.menu-lateral h2 {
    margin: 0 0 15px;
    padding: 0 0 17px 12px;
    color: var(--jm-red);
    border-bottom: 1px solid var(--jm-border);
    border-left: 3px solid var(--jm-red);
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 2px;
}

.menu-lateral a,
.menu-lateral button {
    display: block;
    width: 100%;
    padding: 14px;
    color: #d8dae0;
    background: #191b20;
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 8px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 750;
    text-align: left;
    text-decoration: none;
    cursor: pointer;
    transition: .2s;
}

.menu-lateral a:hover,
.menu-lateral button:hover {
    color: #fff;
    background: #22242a;
    border-color: rgba(255,255,255,.17);
}

.menu-lateral #btnCerrarSesionMenu {
    margin-top: auto;
    color: #ff7781;
    background: rgba(255,53,69,.08);
    border-color: rgba(255,53,69,.25);
}

.menu-lateral #btnCerrarSesionMenu:hover {
    color: #fff;
    background: var(--jm-red-dark);
}

body.menu-abierto .menu-lateral {
    transform: translateX(0);
    visibility: visible;
}

.menu-fondo {
    position: fixed;
    inset: 0;
    z-index: 10001;
    background: rgba(0,0,0,.72);
    opacity: 0;
    visibility: hidden;
    transition: opacity .3s ease, visibility .3s ease;
}

body.menu-abierto .menu-fondo {
    opacity: 1;
    visibility: visible;
}

/* TABLET */

@media (max-width: 1000px) {
    .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .contenedor {
        width: calc(100% - 40px);
    }
}

/* CELULAR */

@media (max-width: 600px) {
    .contenedor {
        width: calc(100% - 26px);
        padding-top: 80px;
        padding-bottom: 30px;
    }

    .encabezado-pedidos {
        align-items: stretch;
        flex-direction: column;
        gap: 20px;
        padding: 23px 19px;
        margin-bottom: 29px;
        border-radius: 15px;
    }

    .encabezado-pedidos h1 {
        font-size: 32px;
    }

    .encabezado-marca {
        font-size: 9px;
        letter-spacing: 2px;
    }

    .encabezado-descripcion {
        font-size: 12px;
    }

    .btn-exportar-todo {
        width: 100%;
        min-height: 46px;
    }

    .barra-lista {
        align-items: flex-start;
        flex-direction: column;
    }

    .grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 13px;
    }

    .card {
        padding: 20px;
    }

    .card h3 {
        font-size: 17px;
    }

    .btns {
        gap: 8px;
    }

    .btns button {
        min-height: 42px;
        font-size: 11px;
    }
}

/* ANIMACIONES ACCESIBLES */

@keyframes jmEntrada {
    from {
        opacity: 0;
        transform: translateY(9px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>

</head>

<body>

    <!-- BOTÓN DEL MENÚ -->
    <button
        id="btnMenu"
        class="btn-menu"
        type="button"
        aria-label="Abrir menú"
        aria-expanded="false">
        ☰
    </button>

    <!-- FONDO OSCURO -->
    <div id="menuFondo" class="menu-fondo"></div>

    <!-- MENÚ LATERAL -->
    <nav id="menuLateral" class="menu-lateral">
        <h2>JAGGER MOVE</h2>

        <a href="index.html">Registrar pedido</a>
        <a href="mispedidos.html">Ver mis pedidos</a>
        <a href="inventario.html">Inventario</a>
        <a href="etiquetas/etiquetas.html">Generar etiquetas</a>

        <button id="btnCerrarSesionMenu" type="button">
            Cerrar sesión
        </button>
    </nav>

    <!-- PEDIDOS -->
    <main class="contenedor">

        <header class="encabezado-pedidos">
            <div class="encabezado-texto">
                <span class="encabezado-marca">
                    JAGGER MOVE / CONTROL DE VENTAS
                </span>

                <h1>MIS <span>PEDIDOS</span></h1>

                <p class="encabezado-descripcion">
                    Administra tus pedidos, actualiza sus estados
                    y organiza tus entregas.
                </p>
            </div>

            <button
                type="button"
                onclick="exportarTodo()"
                class="btn-exportar-todo">
                <span aria-hidden="true">⇩</span>
                EXPORTAR TODO
            </button>
        </header>

        <section aria-label="Lista de pedidos">
            <div class="barra-lista">
                <h2>Pedidos registrados</h2>
                <small>GESTIÓN DE PEDIDOS</small>
            </div>

            <div class="grid" id="gridPedidos" aria-live="polite">
                <p>Cargando pedidos...</p>
            </div>
        </section>

    </main>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // CONEXIÓN CON SUPABASE
        const SUPABASE_URL =
            "https://ckpuoiztfavuuijaedbe.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_qZxbp2ozqUQ9Kj85vSoTSg_JUGIFlJP";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        console.log("Supabase conectado en Mis Pedidos");

        // COMPROBAR SESIÓN
        async function comprobarSesion() {
            const { data, error } = await supabaseClient.auth.getSession();

            if (error) {
                console.error("Error comprobando sesión:", error);
                return;
            }

            document.body.classList.toggle(
                "sesion-activa",
                Boolean(data.session)
            );

            // No mostrar los pedidos si no hay sesión.
            if (!data.session) {
                window.location.href = "index.html";
            }
        }

        // MOSTRAR PEDIDOS
        async function mostrarPedidos() {
            const grid = document.getElementById("gridPedidos");

            grid.innerHTML =
                "<p>Cargando pedidos...</p>";

            const { data: pedidos, error } = await supabaseClient
                .from("pedidos")
                .select("*")
                .order("id", { ascending: false });

            if (error) {
                console.error("ERROR AL CARGAR PEDIDOS:", error);
                grid.innerHTML =
                    "<p>Error al cargar los pedidos</p>";
                alert(error.message);
                return;
            }

            grid.innerHTML = "";

            if (!pedidos || pedidos.length === 0) {
                grid.innerHTML =
                    "<p>No hay pedidos aún. Los pedidos registrados aparecerán aquí.</p>";
                return;
            }

            pedidos.forEach((p) => {
                const estado = p.estado || "En espera";
                const div = document.createElement("div");

                const claseEstado = estado.replace(/\s+/g, "-");
                div.className = `card ${claseEstado}`;

                // Construir la tarjeta con nodos seguros para los datos.
                const titulo = document.createElement("h3");
                titulo.textContent =
                    `${p.nombre || ""} ${p.apellido || ""}`.trim();
                div.appendChild(titulo);

                const codigo = document.createElement("small");
                codigo.textContent = `🔖 Pedido: ${p.codigo || "s/c"}`;
                div.appendChild(codigo);

                const fecha = document.createElement("small");
                fecha.textContent = `📅 Registrado: ${p.fecha || "Sin fecha"}`;
                div.appendChild(fecha);

                function agregarParrafo(etiqueta, valor) {
                    const pEl = document.createElement("p");
                    const negrita = document.createElement("b");

                    negrita.textContent = etiqueta + ": ";
                    pEl.appendChild(negrita);

                    pEl.appendChild(
                        document.createTextNode(String(valor ?? ""))
                    );

                    div.appendChild(pEl);
                }

                agregarParrafo("N°", p.numero);
                agregarParrafo("Provincia", p.provincia);

                agregarParrafo(
                    "Pedido",
                    `${p.pedido || ""} x${p.cantidad || ""}`
                );

                const badge = document.createElement("span");
                badge.className = "badge";
                badge.textContent = estado;
                div.appendChild(badge);

                function crearBoton(texto, color, textoColor, accion) {
                    const btn = document.createElement("button");

                    btn.type = "button";
                    btn.textContent = texto;
                    btn.style.background = color;
                    btn.style.color = textoColor;
                    btn.addEventListener("click", accion);

                    return btn;
                }

                const grupoEstados = document.createElement("div");
                grupoEstados.className = "btns";

                grupoEstados.appendChild(crearBoton(
                    "En espera", "#555d63", "white",
                    () => cambiarEstado(p.codigo, "En espera")
                ));

                grupoEstados.appendChild(crearBoton(
                    "Preparando", "#f2a900", "#171717",
                    () => prepararPedido(p.codigo)
                ));

                grupoEstados.appendChild(crearBoton(
                    "Enviando", "#247bb8", "white",
                    () => enviarPedido(p.codigo)
                ));

                grupoEstados.appendChild(crearBoton(
                    "Entregado", "#168451", "white",
                    () => entregarPedido(p.codigo)
                ));

                div.appendChild(grupoEstados);

                const grupoEliminar = document.createElement("div");
                grupoEliminar.className = "btns";

                grupoEliminar.appendChild(crearBoton(
                    "Eliminar", "#72232a", "white",
                    () => borrarUno(p.codigo)
                ));

                div.appendChild(grupoEliminar);

                const grupoExportar = document.createElement("div");
                grupoExportar.className = "btns";

                grupoExportar.appendChild(crearBoton(
                    "Exportar CSV", "#353535", "white",
                    () => exportarUno(p.codigo)
                ));

                div.appendChild(grupoExportar);

                grid.appendChild(div);
            });
        }

        // OBTENER PEDIDO
        async function obtenerPedido(codigo) {
            const { data, error } = await supabaseClient
                .from("pedidos")
                .select("*")
                .eq("codigo", codigo)
                .single();

            if (error) {
                console.error("ERROR AL BUSCAR PEDIDO:", error);
                alert("No se pudo encontrar el pedido.");
                return null;
            }

            return data;
        }

        // ACTUALIZAR ESTADO MEDIANTE RPC
        async function actualizarEstado(codigo, nuevoEstado) {
            const { data, error } = await supabaseClient.rpc(
                "cambiar_estado_pedido_seguro",
                {
                    p_codigo: codigo,
                    p_nuevo_estado: nuevoEstado
                }
            );

            if (error) {
                console.error("ERROR AL ACTUALIZAR ESTADO:", error);

                alert(
                    "No se pudo actualizar el estado:\n" + error.message
                );

                return false;
            }

            console.log("Resultado:", data);
            await mostrarPedidos();

            return true;
        }

        async function cambiarEstado(codigo, nuevoEstado) {
            await actualizarEstado(codigo, nuevoEstado);
        }

        // PREPARANDO
        async function prepararPedido(codigo) {
            const pedido = await obtenerPedido(codigo);
            if (!pedido) return;

            const actualizado = await actualizarEstado(
                codigo,
                "Preparando"
            );

            if (!actualizado) return;

            let numero = String(pedido.numero || "").replace(/\D/g, "");
            if (numero.length === 9) numero = "51" + numero;

            const mensaje =
`Hola ${pedido.nombre} 👋

Tu pedido ${pedido.codigo} ya está preparado.

📦 Pedido: ${pedido.pedido}
🔢 Cantidad: ${pedido.cantidad}

Nos comunicaremos contigo cuando tu pedido esté en camino.

¡Gracias por tu compra!`;

            abrirWhatsApp(numero, mensaje);
        }

        // ENVIANDO
        async function enviarPedido(codigo) {
            const pedido = await obtenerPedido(codigo);
            if (!pedido) return;

            const actualizado = await actualizarEstado(
                codigo,
                "Enviando"
            );

            if (!actualizado) return;

            let numero = String(pedido.numero || "").replace(/\D/g, "");
            if (numero.length === 9) numero = "51" + numero;

            const mensaje =
`Hola ${pedido.nombre} 👋

Tu pedido ${pedido.codigo} ya está en camino 🚚.

📦 Pedido: ${pedido.pedido}
🔢 Cantidad: ${pedido.cantidad}

Por favor, mantente atento a tu teléfono para la entrega.

¡Gracias por tu compra!`;

            abrirWhatsApp(numero, mensaje);
        }

        // ENTREGADO
        async function entregarPedido(codigo) {
            const pedido = await obtenerPedido(codigo);
            if (!pedido) return;

            const actualizado = await actualizarEstado(
                codigo,
                "Entregado"
            );

            if (!actualizado) return;

            let numero = String(pedido.numero || "").replace(/\D/g, "");
            if (numero.length === 9) numero = "51" + numero;

            const mensaje =
`Hola ${pedido.nombre} 👋

Tu pedido ${pedido.codigo} ha sido entregado correctamente ✅.

📦 Pedido: ${pedido.pedido}
🔢 Cantidad: ${pedido.cantidad}

¡Muchas gracias por tu compra!`;

            abrirWhatsApp(numero, mensaje);
        }

        // ABRIR WHATSAPP
        function abrirWhatsApp(numero, mensaje) {
            if (!numero) {
                alert("Este pedido no tiene número de teléfono.");
                return;
            }

            const url =
                `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;

            window.open(url, "_blank", "noopener");
        }

        // ELIMINAR PEDIDO
        async function borrarUno(codigo) {
            if (!confirm("¿Seguro que quieres eliminar este pedido?")) {
                return;
            }

            const { data, error } = await supabaseClient.rpc(
                "eliminar_pedido_seguro",
                { p_codigo: codigo }
            );

            if (error) {
                console.error("ERROR AL ELIMINAR:", error);

                alert(
                    "No se pudo eliminar el pedido:\n" + error.message
                );

                return;
            }

            alert(data?.mensaje || "Pedido eliminado correctamente.");
            await mostrarPedidos();
        }

        // CONVERTIR PEDIDOS A CSV
        function pedidosACSV(pedidos) {
            const columnas = [
                "codigo", "nombre", "apellido", "numero",
                "provincia", "fecha", "estado", "cantidad", "pedido"
            ];

            const encabezado = columnas.join(";");

            const filas = pedidos.map(p =>
                columnas.map(c =>
                    `"${String(p[c] ?? "").replace(/"/g, '""')}"`
                ).join(";")
            );

            return [encabezado, ...filas].join("\n");
        }

        // DESCARGAR CSV
        function descargarArchivo(contenido, nombreArchivo) {
            const blob = new Blob(
                ["\uFEFF" + contenido],
                { type: "text/csv;charset=utf-8;" }
            );

            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");

            a.href = url;
            a.download = nombreArchivo;

            document.body.appendChild(a);
            a.click();
            a.remove();

            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        // EXPORTAR TODOS
        async function exportarTodo() {
            const { data: pedidos, error } = await supabaseClient
                .from("pedidos")
                .select("*")
                .order("id", { ascending: false });

            if (error) {
                console.error("ERROR AL EXPORTAR:", error);
                alert("No se pudieron obtener los pedidos.");
                return;
            }

            if (!pedidos || pedidos.length === 0) {
                alert("No hay pedidos para exportar.");
                return;
            }

            descargarArchivo(
                pedidosACSV(pedidos),
                "todos_los_pedidos.csv"
            );
        }

        // EXPORTAR UNO
        async function exportarUno(codigo) {
            const pedido = await obtenerPedido(codigo);
            if (!pedido) return;

            const nombre =
                `${pedido.nombre || "pedido"}_${pedido.apellido || ""}`;

            descargarArchivo(
                pedidosACSV([pedido]),
                `pedido_${nombre}.csv`
            );
        }

        // FUNCIONAMIENTO DEL MENÚ
        document.addEventListener("DOMContentLoaded", function () {
            const boton = document.getElementById("btnMenu");
            const fondo = document.getElementById("menuFondo");
            const menu = document.getElementById("menuLateral");

            const btnCerrarSesion =
                document.getElementById("btnCerrarSesionMenu");

            function cerrarMenu() {
                document.body.classList.remove("menu-abierto");
                boton.setAttribute("aria-expanded", "false");
            }

            boton.addEventListener("click", function () {
                const abierto =
                    document.body.classList.toggle("menu-abierto");

                boton.setAttribute("aria-expanded", String(abierto));
            });

            fondo.addEventListener("click", cerrarMenu);

            document.addEventListener("keydown", function (event) {
                if (event.key === "Escape") cerrarMenu();
            });

            // Cerrar sesión con la sesión actual de Supabase
            btnCerrarSesion.addEventListener("click", async function () {
                const confirmar = confirm("¿Deseas cerrar sesión?");
                if (!confirmar) return;

                const { error } = await supabaseClient.auth.signOut();

                if (error) {
                    console.error("Error al cerrar sesión:", error);

                    alert(
                        "No se pudo cerrar sesión: " + error.message
                    );

                    return;
                }

                window.location.href = "index.html";
            });
        });

        // INICIAR
        comprobarSesion();
        mostrarPedidos();
    </script>

</body>
</html>
