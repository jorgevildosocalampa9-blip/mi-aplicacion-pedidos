
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101010">
    <link rel="icon" href="fotos/LOGO.ico" type="image/x-icon">
    <title>Mis Pedidos | JAGGER MOVE</title>
    <link rel="stylesheet" href="./css/Style.css">

    <style>
        /* ========================================
           JAGGER MOVE — DISEÑO DE PEDIDOS
        ======================================== */

        :root {
            --jm-negro: #101010;
            --jm-panel: rgba(19, 19, 19, 0.94);
            --jm-panel-secundario: #202020;
            --jm-rojo: #c51d2a;
            --jm-rojo-hover: #e32937;
            --jm-blanco: #f5f5f5;
            --jm-gris: #a6a6a6;
            --jm-borde: rgba(255, 255, 255, 0.12);
        }

        body {
            color: var(--jm-blanco);
        }

        /* CONTENEDOR PRINCIPAL */

        .contenedor {
            width: min(94%, 1200px);
            margin: 0 auto;
            padding: 90px 0 45px;
            text-align: left;
        }

        /* ENCABEZADO */

        .encabezado-pedidos {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 22px;
            margin-bottom: 28px;
            padding: 25px 28px;
            background: rgba(13, 13, 13, 0.88);
            border: 1px solid var(--jm-borde);
            border-left: 4px solid var(--jm-rojo);
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
        }

        .encabezado-texto {
            min-width: 0;
        }

        .encabezado-marca {
            display: block;
            margin-bottom: 8px;
            color: #e34a53;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 3px;
        }

        .encabezado-pedidos h1 {
            margin: 0;
            color: #fff;
            font-size: clamp(27px, 4vw, 40px);
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .encabezado-pedidos h1 span {
            color: var(--jm-rojo);
        }

        .encabezado-descripcion {
            margin-top: 10px;
            color: #aaa;
            font-size: 13px;
            line-height: 1.6;
        }

        .btn-exportar-todo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            min-height: 45px;
            padding: 12px 18px;
            border: 1px solid var(--jm-rojo);
            border-radius: 8px;
            background: var(--jm-rojo);
            color: white;
            font-family: inherit;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background .2s, transform .2s;
        }

        .btn-exportar-todo:hover {
            background: var(--jm-rojo-hover);
            transform: translateY(-2px);
        }

        /* ENCABEZADO DE LA LISTA */

        .barra-lista {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 0 0 17px;
        }

        .barra-lista h2 {
            margin: 0;
            color: white;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .barra-lista h2::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 17px;
            margin-right: 10px;
            background: var(--jm-rojo);
            vertical-align: -3px;
        }

        .barra-lista small {
            color: var(--jm-gris);
            font-size: 11px;
            letter-spacing: 0.7px;
        }

        /* CUADRÍCULA */

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            align-items: start;
            gap: 18px;
        }

        /* TARJETAS */

        .card {
            position: relative;
            min-width: 0;
            padding: 21px;
            overflow-wrap: anywhere;
            background: var(--jm-panel);
            border: 1px solid var(--jm-borde);
            border-top: 3px solid #899096;
            border-radius: 12px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
            color: white;
            text-align: left;
            transition: transform .2s, border-color .2s,
                        box-shadow .2s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 17px 35px rgba(0, 0, 0, 0.4);
        }

        .card.En-espera {
            border-top-color: #899096;
        }

        .card.Preparando {
            border-top-color: #f2a900;
        }

        .card.Enviando {
            border-top-color: #3698e5;
        }

        .card.Entregado {
            border-top-color: #30bd78;
        }

        .card h3 {
            margin: 0 0 10px;
            color: #fff;
            font-size: 18px;
            font-weight: 800;
            line-height: 1.35;
        }

        .card small {
            display: block;
            margin-bottom: 7px;
            color: #aaa;
            font-size: 11px;
            line-height: 1.5;
        }

        .card p {
            margin: 10px 0;
            color: #dedede;
            font-size: 13px;
            line-height: 1.5;
        }

        .card p b {
            color: #fff;
            font-weight: 700;
        }

        /* ESTADO DEL PEDIDO */

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 8px 0 13px;
            padding: 7px 11px;
            border: 1px solid transparent;
            border-radius: 5px;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .En-espera .badge {
            background: rgba(137, 144, 150, 0.15);
            border-color: rgba(137, 144, 150, 0.4);
            color: #d6d9dc;
        }

        .Preparando .badge {
            background: rgba(242, 169, 0, 0.13);
            border-color: rgba(242, 169, 0, 0.4);
            color: #ffc94d;
        }

        .Enviando .badge {
            background: rgba(54, 152, 229, 0.13);
            border-color: rgba(54, 152, 229, 0.4);
            color: #79c2ff;
        }

        .Entregado .badge {
            background: rgba(48, 189, 120, 0.13);
            border-color: rgba(48, 189, 120, 0.4);
            color: #64e2a1;
        }

        /* BOTONES DE ACCIONES */

        .btns {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 7px;
            margin-top: 12px;
        }

        .btns button {
            min-width: 0;
            min-height: 36px;
            padding: 9px 7px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 6px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 800;
            line-height: 1.3;
            overflow-wrap: anywhere;
            cursor: pointer;
            transition: filter .2s, transform .2s;
        }

        .btns button:hover {
            filter: brightness(1.15);
            transform: translateY(-1px);
        }

        .btns button:focus-visible,
        .btn-exportar-todo:focus-visible,
        .btn-menu:focus-visible {
            outline: 2px solid white;
            outline-offset: 3px;
        }

        /* SEPARACIÓN DE ACCIONES SECUNDARIAS */

        .card .btns + .btns {
            margin-top: 8px;
        }

        /* MENSAJES DE CARGA, ERROR Y LISTA VACÍA */

        #gridPedidos > p {
            grid-column: 1 / -1;
            margin: 0;
            padding: 28px 20px;
            background: rgba(17, 17, 17, 0.9);
            border: 1px solid var(--jm-borde);
            border-radius: 10px;
            color: #ddd !important;
            font-size: 14px;
            line-height: 1.6;
            text-align: center;
        }

        /* MENÚ LATERAL */

        .btn-menu {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 10002;
            display: block;
            padding: 12px 17px;
            border: 1px solid #414141;
            border-left: 3px solid var(--jm-rojo);
            border-radius: 7px;
            background: #151515;
            color: white;
            font-family: inherit;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-menu:hover {
            background: #292929;
        }

        .menu-lateral {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            max-width: 85vw;
            height: 100vh;
            height: 100dvh;
            box-sizing: border-box;
            padding: 78px 20px 24px;
            background: #121212;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 11px;
            overflow-y: auto;
            z-index: 10003;
            transform: translateX(-105%);
            visibility: hidden;
            transition: transform .3s ease, visibility .3s ease;
        }

        .menu-lateral h2 {
            margin: 0 0 17px;
            padding-bottom: 16px;
            border-bottom: 1px solid #333;
            border-left: 3px solid var(--jm-rojo);
            padding-left: 12px;
            color: white;
            font-family: inherit;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1.5px;
        }

        .menu-lateral a,
        .menu-lateral button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border: 1px solid #303030;
            border-radius: 7px;
            background: #202020;
            color: white;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            text-align: left;
            text-decoration: none;
            cursor: pointer;
            transition: background .2s, border-color .2s;
        }

        .menu-lateral a:hover,
        .menu-lateral button:hover {
            background: #303030;
            border-color: #555;
        }

        .menu-lateral #btnCerrarSesionMenu {
            margin-top: auto;
            background: rgba(197, 29, 42, 0.12);
            border-color: rgba(197, 29, 42, 0.5);
            color: #ff8b92;
        }

        .menu-lateral #btnCerrarSesionMenu:hover {
            background: var(--jm-rojo);
            color: white;
        }

        body.menu-abierto .menu-lateral {
            transform: translateX(0);
            visibility: visible;
        }

        .menu-fondo {
            position: fixed;
            inset: 0;
            z-index: 10001;
            background: rgba(0, 0, 0, 0.7);
            opacity: 0;
            visibility: hidden;
            transition: opacity .3s ease, visibility .3s ease;
        }

        body.menu-abierto .menu-fondo {
            opacity: 1;
            visibility: visible;
        }

        /* ACCESIBILIDAD */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }

        /* TABLETS */

        @media (max-width: 950px) {
            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .contenedor {
                width: 94%;
            }
        }

        /* CELULARES */

        @media (max-width: 600px) {
            .contenedor {
                width: 92%;
                padding-top: 82px;
                padding-bottom: 28px;
            }

            .encabezado-pedidos {
                align-items: stretch;
                padding: 21px 18px;
                gap: 18px;
            }

            .encabezado-pedidos h1 {
                font-size: 29px;
            }

            .encabezado-descripcion {
                font-size: 12px;
            }

            .btn-exportar-todo {
                width: 100%;
            }

            .grid {
                grid-template-columns: minmax(0, 1fr);
                gap: 14px;
            }

            .card {
                padding: 19px;
            }

            .barra-lista {
                align-items: flex-start;
                flex-direction: column;
            }

            .btns button {
                min-height: 40px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- BOTÓN DEL MENÚ -->
    <button
        id="btnMenu"
        class="btn-menu"
        type="button"
        aria-label="Abrir menú"
        aria-expanded="false">
        ☰
    </button>

    <!-- FONDO OSCURO -->
    <div id="menuFondo" class="menu-fondo"></div>

    <!-- MENÚ LATERAL -->
    <nav id="menuLateral" class="menu-lateral">
        <h2>JAGGER MOVE</h2>

        <a href="index.html">Registrar pedido</a>
        <a href="mispedidos.html">Ver mis pedidos</a>
        <a href="inventario.html">Inventario</a>
        <a href="etiquetas/etiquetas.html">Generar etiquetas</a>

        <button id="btnCerrarSesionMenu" type="button">
            Cerrar sesión
        </button>
    </nav>

    <!-- PEDIDOS -->
    <main class="contenedor">

        <header class="encabezado-pedidos">
            <div class="encabezado-texto">
                <span class="encabezado-marca">
                    JAGGER MOVE / CONTROL DE VENTAS
                </span>

                <h1>MIS <span>PEDIDOS</span></h1>

                <p class="encabezado-descripcion">
                    Administra tus pedidos, actualiza sus estados
                    y organiza tus entregas.
                </p>
            </div>

            <button
                type="button"
                onclick="exportarTodo()"
                class="btn-exportar-todo">
                <span aria-hidden="true">⇩</span>
                EXPORTAR TODO
            </button>
        </header>

        <section aria-label="Lista de pedidos">
            <div class="barra-lista">
                <h2>Pedidos registrados</h2>
                <small>GESTIÓN DE PEDIDOS</small>
            </div>

            <div class="grid" id="gridPedidos" aria-live="polite">
                <p>Cargando pedidos...</p>
            </div>
        </section>

    </main>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // CONEXIÓN CON SUPABASE
        const SUPABASE_URL =
            "https://ckpuoiztfavuuijaedbe.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_qZxbp2ozqUQ9Kj85vSoTSg_JUGIFlJP";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        console.log("Supabase conectado en Mis Pedidos");

        // COMPROBAR SESIÓN
        async function comprobarSesion() {
            const { data, error } = await supabaseClient.auth.getSession();

            if (error) {
                console.error("Error comprobando sesión:", error);
                return;
            }

            document.body.classList.toggle(
                "sesion-activa",
                Boolean(data.session)
            );

            // No mostrar los pedidos si no hay sesión.
            if (!data.session) {
                window.location.href = "index.html";
            }
        }

        // MOSTRAR PEDIDOS
        async function mostrarPedidos() {
            const grid = document.getElementById("gridPedidos");

            grid.innerHTML =
                "<p>Cargando pedidos...</p>";

            const { data: pedidos, error } = await supabaseClient
                .from("pedidos")
                .select("*")
                .order("id", { ascending: false });

            if (error) {
                console.error("ERROR AL CARGAR PEDIDOS:", error);
                grid.innerHTML =
                    "<p>Error al cargar los pedidos</p>";
                alert(error.message);
                return;
            }

            grid.innerHTML = "";

            if (!pedidos || pedidos.length === 0) {
                grid.innerHTML =
                    "<p>No hay pedidos aún. Los pedidos registrados aparecerán aquí.</p>";
                return;
            }

            pedidos.forEach((p) => {
                const estado = p.estado || "En espera";
                const div = document.createElement("div");

                const claseEstado = estado.replace(/\s+/g, "-");
                div.className = `card ${claseEstado}`;

                // Construir la tarjeta con nodos seguros para los datos.
                const titulo = document.createElement("h3");
                titulo.textContent =
                    `${p.nombre || ""} ${p.apellido || ""}`.trim();
                div.appendChild(titulo);

                const codigo = document.createElement("small");
                codigo.textContent = `🔖 Pedido: ${p.codigo || "s/c"}`;
                div.appendChild(codigo);

                const fecha = document.createElement("small");
                fecha.textContent = `📅 Registrado: ${p.fecha || "Sin fecha"}`;
                div.appendChild(fecha);

                function agregarParrafo(etiqueta, valor) {
                    const pEl = document.createElement("p");
                    const negrita = document.createElement("b");

                    negrita.textContent = etiqueta + ": ";
                    pEl.appendChild(negrita);

                    pEl.appendChild(
                        document.createTextNode(String(valor ?? ""))
                    );

                    div.appendChild(pEl);
                }

                agregarParrafo("N°", p.numero);
                agregarParrafo("Provincia", p.provincia);

                agregarParrafo(
                    "Pedido",
                    `${p.pedido || ""} x${p.cantidad || ""}`
                );

                const badge = document.createElement("span");
                badge.className = "badge";
                badge.textContent = estado;
                div.appendChild(badge);

                function crearBoton(texto, color, textoColor, accion) {
                    const btn = document.createElement("button");

                    btn.type = "button";
                    btn.textContent = texto;
                    btn.style.background = color;
                    btn.style.color = textoColor;
                    btn.addEventListener("click", accion);

                    return btn;
                }

                const grupoEstados = document.createElement("div");
                grupoEstados.className = "btns";

                grupoEstados.appendChild(crearBoton(
                    "En espera", "#555d63", "white",
                    () => cambiarEstado(p.codigo, "En espera")
                ));

                grupoEstados.appendChild(crearBoton(
                    "Preparando", "#f2a900", "#171717",
                    () => prepararPedido(p.codigo)
                ));

                grupoEstados.appendChild(crearBoton(
                    "Enviando", "#247bb8", "white",
                    () => enviarPedido(p.codigo)
                ));

                grupoEstados.appendChild(crearBoton(
                    "Entregado", "#168451", "white",
                    () => entregarPedido(p.codigo)
                ));

                div.appendChild(grupoEstados);

                const grupoEliminar = document.createElement("div");
                grupoEliminar.className = "btns";

                grupoEliminar.appendChild(crearBoton(
                    "Eliminar", "#72232a", "white",
                    () => borrarUno(p.codigo)
                ));

                div.appendChild(grupoEliminar);

                const grupoExportar = document.createElement("div");
                grupoExportar.className = "btns";

                grupoExportar.appendChild(crearBoton(
                    "Exportar CSV", "#353535", "white",
                    () => exportarUno(p.codigo)
                ));

                div.appendChild(grupoExportar);

                grid.appendChild(div);
            });
        }

        // OBTENER PEDIDO
        async function obtenerPedido(codigo) {
            const { data, error } = await supabaseClient
                .from("pedidos")
                .select("*")
                .eq("codigo", codigo)
                .single();

            if (error) {
                console.error("ERROR AL BUSCAR PEDIDO:", error);
                alert("No se pudo encontrar el pedido.");
                return null;
            }

            return data;
        }

        // ACTUALIZAR ESTADO MEDIANTE RPC
        async function actualizarEstado(codigo, nuevoEstado) {
            const { data, error } = await supabaseClient.rpc(
                "cambiar_estado_pedido_seguro",
                {
                    p_codigo: codigo,
                    p_nuevo_estado: nuevoEstado
                }
            );

            if (error) {
                console.error("ERROR AL ACTUALIZAR ESTADO:", error);

                alert(
                    "No se pudo actualizar el estado:\n" + error.message
                );

                return false;
            }

            console.log("Resultado:", data);
            await mostrarPedidos();

            return true;
        }

        async function cambiarEstado(codigo, nuevoEstado) {
            await actualizarEstado(codigo, nuevoEstado);
        }

        // PREPARANDO
        async function prepararPedido(codigo) {
            const pedido = await obtenerPedido(codigo);
            if (!pedido) return;

            const actualizado = await actualizarEstado(
                codigo,
                "Preparando"
            );

            if (!actualizado) return;

            let numero = String(pedido.numero || "").replace(/\D/g, "");
            if (numero.length === 9) numero = "51" + numero;

            const mensaje =
`Hola ${pedido.nombre} 👋

Tu pedido ${pedido.codigo} ya está preparado.

📦 Pedido: ${pedido.pedido}
🔢 Cantidad: ${pedido.cantidad}

Nos comunicaremos contigo cuando tu pedido esté en camino.

¡Gracias por tu compra!`;

            abrirWhatsApp(numero, mensaje);
        }

        // ENVIANDO
        async function enviarPedido(codigo) {
            const pedido = await obtenerPedido(codigo);
            if (!pedido) return;

            const actualizado = await actualizarEstado(
                codigo,
                "Enviando"
            );

            if (!actualizado) return;

            let numero = String(pedido.numero || "").replace(/\D/g, "");
            if (numero.length === 9) numero = "51" + numero;

            const mensaje =
`Hola ${pedido.nombre} 👋

Tu pedido ${pedido.codigo} ya está en camino 🚚.

📦 Pedido: ${pedido.pedido}
🔢 Cantidad: ${pedido.cantidad}

Por favor, mantente atento a tu teléfono para la entrega.

¡Gracias por tu compra!`;

            abrirWhatsApp(numero, mensaje);
        }

        // ENTREGADO
        async function entregarPedido(codigo) {
            const pedido = await obtenerPedido(codigo);
            if (!pedido) return;

            const actualizado = await actualizarEstado(
                codigo,
                "Entregado"
            );

            if (!actualizado) return;

            let numero = String(pedido.numero || "").replace(/\D/g, "");
            if (numero.length === 9) numero = "51" + numero;

            const mensaje =
`Hola ${pedido.nombre} 👋

Tu pedido ${pedido.codigo} ha sido entregado correctamente ✅.

📦 Pedido: ${pedido.pedido}
🔢 Cantidad: ${pedido.cantidad}

¡Muchas gracias por tu compra!`;

            abrirWhatsApp(numero, mensaje);
        }

        // ABRIR WHATSAPP
        function abrirWhatsApp(numero, mensaje) {
            if (!numero) {
                alert("Este pedido no tiene número de teléfono.");
                return;
            }

            const url =
                `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;

            window.open(url, "_blank", "noopener");
        }

        // ELIMINAR PEDIDO
        async function borrarUno(codigo) {
            if (!confirm("¿Seguro que quieres eliminar este pedido?")) {
                return;
            }

            const { data, error } = await supabaseClient.rpc(
                "eliminar_pedido_seguro",
                { p_codigo: codigo }
            );

            if (error) {
                console.error("ERROR AL ELIMINAR:", error);

                alert(
                    "No se pudo eliminar el pedido:\n" + error.message
                );

                return;
            }

            alert(data?.mensaje || "Pedido eliminado correctamente.");
            await mostrarPedidos();
        }

        // CONVERTIR PEDIDOS A CSV
        function pedidosACSV(pedidos) {
            const columnas = [
                "codigo", "nombre", "apellido", "numero",
                "provincia", "fecha", "estado", "cantidad", "pedido"
            ];

            const encabezado = columnas.join(";");

            const filas = pedidos.map(p =>
                columnas.map(c =>
                    `"${String(p[c] ?? "").replace(/"/g, '""')}"`
                ).join(";")
            );

            return [encabezado, ...filas].join("\n");
        }

        // DESCARGAR CSV
        function descargarArchivo(contenido, nombreArchivo) {
            const blob = new Blob(
                ["\uFEFF" + contenido],
                { type: "text/csv;charset=utf-8;" }
            );

            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");

            a.href = url;
            a.download = nombreArchivo;

            document.body.appendChild(a);
            a.click();
            a.remove();

            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        // EXPORTAR TODOS
        async function exportarTodo() {
            const { data: pedidos, error } = await supabaseClient
                .from("pedidos")
                .select("*")
                .order("id", { ascending: false });

            if (error) {
                console.error("ERROR AL EXPORTAR:", error);
                alert("No se pudieron obtener los pedidos.");
                return;
            }

            if (!pedidos || pedidos.length === 0) {
                alert("No hay pedidos para exportar.");
                return;
            }

            descargarArchivo(
                pedidosACSV(pedidos),
                "todos_los_pedidos.csv"
            );
        }

        // EXPORTAR UNO
        async function exportarUno(codigo) {
            const pedido = await obtenerPedido(codigo);
            if (!pedido) return;

            const nombre =
                `${pedido.nombre || "pedido"}_${pedido.apellido || ""}`;

            descargarArchivo(
                pedidosACSV([pedido]),
                `pedido_${nombre}.csv`
            );
        }

        // FUNCIONAMIENTO DEL MENÚ
        document.addEventListener("DOMContentLoaded", function () {
            const boton = document.getElementById("btnMenu");
            const fondo = document.getElementById("menuFondo");
            const menu = document.getElementById("menuLateral");

            const btnCerrarSesion =
                document.getElementById("btnCerrarSesionMenu");

            function cerrarMenu() {
                document.body.classList.remove("menu-abierto");
                boton.setAttribute("aria-expanded", "false");
            }

            boton.addEventListener("click", function () {
                const abierto =
                    document.body.classList.toggle("menu-abierto");

                boton.setAttribute("aria-expanded", String(abierto));
            });

            fondo.addEventListener("click", cerrarMenu);

            document.addEventListener("keydown", function (event) {
                if (event.key === "Escape") cerrarMenu();
            });

            // Cerrar sesión con la sesión actual de Supabase
            btnCerrarSesion.addEventListener("click", async function () {
                const confirmar = confirm("¿Deseas cerrar sesión?");
                if (!confirmar) return;

                const { error } = await supabaseClient.auth.signOut();

                if (error) {
                    console.error("Error al cerrar sesión:", error);

                    alert(
                        "No se pudo cerrar sesión: " + error.message
                    );

                    return;
                }

                window.location.href = "index.html";
            });
        });

        // INICIAR
        comprobarSesion();
        mostrarPedidos();
    </script>

</body>
</html>
