<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f2f2;
        }

        .reset-box {
            width: 90%;
            max-width: 380px;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            box-sizing: border-box;
        }

        .reset-box h2 {
            margin-bottom: 20px;
        }

        .reset-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .reset-box button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #222;
            color: white;
        }

        #mensaje {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="reset-box">

        <h2>Nueva contraseña</h2>

        <input
            type="password"
            id="nuevaPassword"
            placeholder="Nueva contraseña"
        >

        <input
            type="password"
            id="confirmarPassword"
            placeholder="Confirmar contraseña"
        >

        <button id="btnCambiarPassword">
            Cambiar contraseña
        </button>

        <p id="mensaje"></p>

    </div>

    <script>

        const SUPABASE_URL = "https://ckpuoiztfavuuijaedbe.supabase.co";
        const SUPABASE_KEY = "sb_publishable_qZxbp2ozqUQ9Kj85vSoTSg_JUGIFlJP";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        const btnCambiarPassword =
            document.getElementById("btnCambiarPassword");

        const mensaje =
            document.getElementById("mensaje");

        btnCambiarPassword.addEventListener("click", async () => {

            const nuevaPassword =
                document.getElementById("nuevaPassword").value;

            const confirmarPassword =
                document.getElementById("confirmarPassword").value;

            mensaje.textContent = "";

            if (!nuevaPassword || !confirmarPassword) {
                mensaje.textContent =
                    "Completa ambos campos.";
                return;
            }

            if (nuevaPassword !== confirmarPassword) {
                mensaje.textContent =
                    "Las contraseñas no coinciden.";
                return;
            }

            if (nuevaPassword.length < 6) {
                mensaje.textContent =
                    "La contraseña debe tener al menos 6 caracteres.";
                return;
            }

            const { error } =
                await supabaseClient.auth.updateUser({
                    password: nuevaPassword
                });

            if (error) {
                mensaje.textContent =
                    "No se pudo cambiar la contraseña.";
                console.error(error);
                return;
            }

            mensaje.textContent =
                "Contraseña cambiada correctamente.";

            setTimeout(() => {
                window.location.href = "index.html";
            }, 1500);

        });

    </script>

</body>
</html>
